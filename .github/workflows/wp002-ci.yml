name: WP-002 CI Supply Chain Evidence

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validation:
    name: Build, Test, Audit, Evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore implementation/Bluto.Validation.sln

      - name: Build
        run: dotnet build implementation/Bluto.Validation.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test implementation/Bluto.Validation.sln --configuration Release --no-build --logger "trx;LogFileName=bluto-tests.trx" --results-directory implementation/validation/test-results

      - name: Format
        run: dotnet format implementation/Bluto.Validation.sln --verify-no-changes

      - name: NuGet vulnerability audit
        run: dotnet list implementation/Bluto.Validation.sln package --vulnerable --include-transitive

      - name: Run repository validator
        run: dotnet run --project implementation/src/Bluto.Validation.Cli --configuration Release -- --root .

      - name: Validate RVEC and CI evidence JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool implementation/validation/report.json >/dev/null
          for evidence in repository/evidence/rvec/*.json; do
            python -m json.tool "$evidence" >/dev/null
          done
          python -m json.tool implementation/validation/ci-evidence.schema.json >/dev/null

      - name: Generate CI evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p implementation/validation
          cat > implementation/validation/ci-evidence-manifest.json <<EOF
          {
            "schema_version": "1.0.0",
            "work_package": "WP-002",
            "commit_sha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "workflow_ref": "${GITHUB_WORKFLOW_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "execution_mode": "GitHub Actions",
            "commands": [
              "dotnet restore implementation/Bluto.Validation.sln",
              "dotnet build implementation/Bluto.Validation.sln --configuration Release --no-restore",
              "dotnet test implementation/Bluto.Validation.sln --configuration Release --no-build",
              "dotnet format implementation/Bluto.Validation.sln --verify-no-changes",
              "dotnet list implementation/Bluto.Validation.sln package --vulnerable --include-transitive",
              "dotnet run --project implementation/src/Bluto.Validation.Cli --configuration Release -- --root .",
              "python -m json.tool repository/evidence/rvec/*.json"
            ]
          }
          EOF
          python -m json.tool implementation/validation/ci-evidence-manifest.json >/dev/null

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: wp002-validation-evidence-${{ github.sha }}
          path: |
            implementation/validation/report.json
            implementation/validation/ci-evidence.schema.json
            implementation/validation/ci-evidence-manifest.json
            implementation/validation/test-results/*.trx
            repository/evidence/rvec/*.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build for CodeQL
        run: dotnet build implementation/Bluto.Validation.sln --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.3
        with:
          upload: false
          output: implementation/validation/codeql-results

      - name: Upload CodeQL evidence
        uses: actions/upload-artifact@v7
        with:
          name: wp002-codeql-evidence-${{ github.sha }}
          path: implementation/validation/codeql-results
          if-no-files-found: error
          retention-days: 30

  trivy:
    name: Trivy FS And SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'implementation/validation/trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate Trivy SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'implementation/validation/sbom.cdx.json'
          exit-code: '0'

      - name: Validate scan artifact JSON
        run: |
          python -m json.tool implementation/validation/trivy-results.sarif >/dev/null
          python -m json.tool implementation/validation/sbom.cdx.json >/dev/null

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wp002-supply-chain-evidence-${{ github.sha }}
          path: |
            implementation/validation/trivy-results.sarif
            implementation/validation/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
  runtime-smoke:
    name: WP-012 Runtime Configuration And Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Restore
        run: dotnet restore implementation/Bluto.Validation.sln

      - name: Terraform format
        run: terraform -chdir=implementation/infra/terraform fmt -check

      - name: Terraform init without backend
        run: terraform -chdir=implementation/infra/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=implementation/infra/terraform validate

      - name: Runtime smoke tests
        run: dotnet test implementation/tests/Smoke/Bluto.Smoke.Tests.csproj --configuration Release --filter Smoke --logger "trx;LogFileName=wp012-smoke.trx" --results-directory implementation/validation/test-results

      - name: Publish API artifact
        run: dotnet publish implementation/src/Bluto.Api/Bluto.Api.csproj --configuration Release --no-restore

      - name: Publish worker artifact
        run: dotnet publish implementation/src/Bluto.Worker/Bluto.Worker.csproj --configuration Release --no-restore

      - name: Validate deployment JSON artifacts
        run: |
          python -m json.tool implementation/deploy/configuration/bluto-runtime-config.schema.json >/dev/null
          python -m json.tool implementation/deploy/configuration/nonproduction.sample.json >/dev/null
          python -m json.tool implementation/deploy/contracts/operational-health.contract.json >/dev/null
          python -m json.tool implementation/deploy/smoke/nonproduction-smoke-plan.json >/dev/null

      - name: Upload WP-012 evidence
        uses: actions/upload-artifact@v7
        with:
          name: wp012-runtime-smoke-evidence-${{ github.sha }}
          path: |
            implementation/deploy/**
            implementation/infra/terraform/**
            implementation/runbooks/wp-012-operational-smoke.md
            implementation/validation/test-results/wp012-smoke.trx
            implementation/src/Bluto.Api/bin/Release/net10.0/publish/**
            implementation/src/Bluto.Worker/bin/Release/net10.0/publish/**
          if-no-files-found: error
          retention-days: 30
