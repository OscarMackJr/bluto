# Local Flyway configuration for Bluto implementation migrations.
# Credentials and JDBC URLs are intentionally not stored here.
flyway.locations=filesystem:implementation/db/migrations,filesystem:implementation/db/callbacks
flyway.defaultSchema=flyway_history
flyway.schemas=flyway_history,identity_resolution,integration_outbox
flyway.createSchemas=true
flyway.validateMigrationNaming=true
flyway.connectRetries=10
